[package]
name = "codetwo-desktop-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C2 native sidecar — a JSON-lines desktop container over CoreApp."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
blake3 = "1"
codetwo-core.workspace = true
codetwo-kernel.workspace = true
codetwo-plugins.workspace = true
codetwo-server = { path = "../../../crates/server" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
url = "2"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[lib]
name = "codetwo_desktop_host"
