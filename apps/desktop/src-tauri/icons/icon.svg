<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Code2 app mark: a geometric C and 2, reduced to two high-contrast strokes so
       the product name remains identifiable at Dock and title-bar sizes. -->
  <defs>
    <linearGradient id="background" x1="0.12" y1="0.04" x2="0.88" y2="0.96">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.52" stop-color="#201B52"/>
      <stop offset="1" stop-color="#11152F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#7C6DFF" stop-opacity="0.46"/>
      <stop offset="0.48" stop-color="#5B4DE8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#161A38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="two" x1="0.22" y1="0.08" x2="0.78" y2="0.92">
      <stop offset="0" stop-color="#9EF0FF"/>
      <stop offset="1" stop-color="#48B9F2"/>
    </linearGradient>
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#070A1C" flood-opacity="0.32"/>
    </filter>
    <clipPath id="squircle">
      <path d="M512 100C684 100 790 100 856 168C924 234 924 340 924 512C924 684 924 790 856 856C790 924 684 924 512 924C340 924 234 924 168 856C100 790 100 684 100 512C100 340 100 234 168 168C234 100 340 100 512 100Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#background)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark-shadow)">
      <path d="M594 328C545 284 470 268 404 291C319 321 263 401 263 500C263 616 342 713 448 737C508 751 567 738 612 706"
            stroke="#FFFFFF" stroke-width="96"/>
      <path d="M592 383C616 328 674 300 731 320C790 341 821 406 802 463C792 493 771 517 747 541L590 696H805"
            stroke="url(#two)" stroke-width="82"/>
    </g>
  </g>
</svg>
