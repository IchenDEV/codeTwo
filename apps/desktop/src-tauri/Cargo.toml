[package]
name = "codetwo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "codeTwo desktop app (Tauri v2) — thin bridge over codetwo-core."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `transparent: true` rides on: without it the window stays opaque and
# the NSVisualEffectView material never shows through. tauri-build keeps this in sync with the
# `macOSPrivateApi` flag in tauri.conf.json — change it there, not here.
# `devtools` keeps the inspector available in release builds too — the built-in browser panel has
# an "Open DevTools" item, and a menu entry that only works in debug builds is a broken promise.
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
codetwo-core.workspace = true
codetwo-server = { path = "../../../crates/server" }
tauri-plugin-dialog = "2"

[lib]
name = "codetwo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
