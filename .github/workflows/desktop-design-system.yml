name: Desktop design system

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/design/system.md"
      - ".github/workflows/desktop-design-system.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/design/system.md"
      - ".github/workflows/desktop-design-system.yml"

permissions:
  contents: read

concurrency:
  group: desktop-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      taskboard: ${{ steps.filter.outputs.taskboard }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            taskboard:
              - 'apps/desktop/src/taskboard/**'
              - 'apps/desktop/tests/taskBoard*'
              - 'apps/desktop/stryker.taskboard.config.json'
              - 'apps/desktop/tsconfig.stryker.json'

  desktop:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        run: bun run check && bunx tsc --noEmit
      - name: Run desktop tests
        run: bun run test:ci
      - name: Require zero surviving TaskBoard model mutants
        if: needs.changes.outputs.taskboard == 'true'
        run: bun run mutation:taskboard
      - name: Build desktop renderer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx vite build
