name: Desktop design system

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "docs/design.md"
      - ".github/workflows/desktop-design-system.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "docs/design.md"
      - ".github/workflows/desktop-design-system.yml"

permissions:
  contents: read

concurrency:
  group: desktop-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run desktop tests
        run: bun test
      - name: Lint and build desktop renderer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build:renderer

  test-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run desktop tests
        run: bun test
