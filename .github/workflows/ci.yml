name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdlc:
    name: SDLC and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            taskboard:
              - 'apps/desktop/src/taskboard/**'
              - 'apps/desktop/tests/taskBoard*'
              - 'apps/desktop/stryker.taskboard.config.json'
              - 'apps/desktop/tsconfig.stryker.json'
      - name: Install dependencies
        run: bun install --frozen-lockfile --cwd apps/desktop
      - name: SDLC checks
        run: |
          bun test script/verify/checks.test.ts script/verify/four-stage.test.ts script/devflow.test.ts
          bun script/verify/docs.ts
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bun script/devflow.ts check-pr
          else
            bun script/verify/sdlc.ts
          fi
      - name: Desktop lint and typecheck
        working-directory: apps/desktop
        run: |
          bun run check
          bunx tsc --noEmit
      - name: Desktop tests
        working-directory: apps/desktop
        run: bun run test:ci
      - name: TaskBoard mutation testing
        if: steps.changes.outputs.taskboard == 'true'
        working-directory: apps/desktop
        run: bun run mutation:taskboard
      - name: Build desktop renderer
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx vite build

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig 0.15.2
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 sudo apt-get install -y snapd || true
          curl -L https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz | tar xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace
