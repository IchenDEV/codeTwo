name: SDLC contract

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Test lifecycle and devflow Gates
        run: bun test script/verify/checks.test.ts script/devflow.test.ts
      - name: Validate documentation
        run: bun script/verify/docs.ts
      - name: Validate PR records, changed scope, and review readiness
        if: github.event_name == 'pull_request'
        run: bun script/devflow.ts check-pr
      - name: Validate canonical lifecycle records
        if: github.event_name != 'pull_request'
        run: bun script/verify/sdlc.ts
