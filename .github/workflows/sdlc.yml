name: SDLC contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Test repository Gates
        run: bun test script/verify/checks.test.ts
      - name: Validate canonical Artifacts and evidence
        run: bun script/verify/sdlc.ts
      - name: Validate documentation catalog and archive
        run: bun script/verify/docs.ts
      - name: Enforce branch lifecycle readiness
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun script/verify/sdlc.ts --base "$BASE_SHA"
