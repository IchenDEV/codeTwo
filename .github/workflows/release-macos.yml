name: Release macOS
run-name: Release C2 ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example 0.1.0 or 0.2.0-beta.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Validate version and tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Versioned releases must be dispatched from the main branch." >&2
            exit 1
          fi

          version="$INPUT_VERSION"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Version must be SemVer, for example 0.1.0 or 0.2.0-beta.1." >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; releases are immutable." >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build versioned ad-hoc signed DMG
        working-directory: apps/desktop
        env:
          ELECTROBUN_AD_HOC_SIGN: "1"
          ELECTROBUN_CREATE_DMG: "1"
          ELECTROBUN_DEVELOPER_ID: "-"
          NODE_OPTIONS: --max-old-space-size=4096
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build:release

      - name: Verify and stage release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          dmg_count="$(find apps/desktop/artifacts -maxdepth 1 -name 'stable-macos-arm64-*.dmg' -print | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 1
          dmg_path="$(find apps/desktop/artifacts -maxdepth 1 -name 'stable-macos-arm64-*.dmg' -print -quit)"
          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then
              hdiutil detach "$device" >/dev/null
            fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          device="$(hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" \
            | awk '/Apple_HFS|Apple_APFS/ { print $1; exit }')"
          test -n "$device"

          app="$mount_dir/C2.app"
          executable="$app/Contents/MacOS/launcher"
          info_plist="$app/Contents/Info.plist"
          test -d "$app"
          test -L "$mount_dir/Applications"
          test "$(plutil -extract CFBundleName raw -- "$info_plist")" = "C2"
          test "$(plutil -extract CFBundleDisplayName raw -- "$info_plist")" = "C2"
          test "$(plutil -extract CFBundleIdentifier raw -- "$info_plist")" = "dev.codetwo.app"
          test "$(plutil -extract CFBundleShortVersionString raw -- "$info_plist")" = "$RELEASE_VERSION"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$executable")" = "arm64"

          mkdir -p release
          release_dmg="C2-${RELEASE_TAG}-macos-arm64.dmg"
          cp "$dmg_path" "release/$release_dmg"
          (
            cd release
            shasum -a 256 "$release_dmg" > "$release_dmg.sha256"
          )

      - name: Publish GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          args=(
            release create "$RELEASE_TAG"
            release/*
            --target "$GITHUB_SHA"
            --title "C2 $RELEASE_TAG"
            --notes "Apple Silicon DMG. This build is ad-hoc signed and not Apple-notarized."
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
