            if (termWs?.readyState === 1) termWs.send(JSON.stringify({ op: "resize", rows, cols }));
          });
        }
        termFit.fit();
        setTermStatus("Connecting…");
        const ticket = await termTicket();
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/ws/terminal?ticket=${encodeURIComponent(ticket)}`);
        termWs = ws;
        ws.onopen = () => {
          ws.send(JSON.stringify({ op: "attach", id, rows: term.rows, cols: term.cols }));
        };
        ws.onmessage = (message) => {
          const msg = JSON.parse(message.data);
          if (msg.kind === "attached") {
            term.reset();
            if (msg.restore) term.write(msg.restore);
            setTermStatus(msg.created ? "Shell started" : "Reattached" + (msg.title ? " · " + msg.title : ""));
            void refreshTermList();
          } else if (msg.kind === "data") {
            term.write(msg.data);
          } else if (msg.kind === "title") {
            setTermStatus(msg.title);
          } else if (msg.kind === "exit") {
            setTermStatus("Terminal exited");
            ws.onclose = null;
            ws.close();
            if (termWs === ws) termWs = null;
            void refreshTermList();
          } else if (msg.kind === "error") {
            setTermStatus(msg.message, true);
          }
        };
        ws.onclose = () => {
          if (termWs !== ws) return;
          termWs = null;
          setTermStatus("Terminal disconnected — retrying…");
          scheduleTermRetry(id);
        };
      }

      // Keep retrying while the server is unreachable; only a lost pairing ends the loop (the
      // pairing overlay is already up at that point).
      function scheduleTermRetry(id) {
        if (termRetryTimer) return;
        termRetryTimer = setTimeout(() => {
          termRetryTimer = null;
          void openTerminal(id).catch((error) => {
            setTermStatus(error.message, true);
            if (error.message !== "not paired" && error.message !== "access revoked") {
              scheduleTermRetry(id);
            }
          });
        }, 1500);
      }

      function showView(name) {
        const isTerm = name === "term";
        termView.hidden = !isTerm;
        mainView.hidden = isTerm;
        sessionsEl.hidden = isTerm;
        viewChatButton.classList.toggle("active", !isTerm);
        viewTermButton.classList.toggle("active", isTerm);
        if (isTerm) {
          if (!termWs && !termRetryTimer) {
            const saved = localStorage.getItem(TERM_ID_KEY) || newTermId();
            void refreshTermList();
            void openTerminal(saved).catch((error) => {
              setTermStatus(error.message, true);
              if (error.message !== "not paired" && error.message !== "access revoked") scheduleTermRetry(saved);
            });
          } else {
            termFit?.fit();
          }
        }
      }
      viewChatButton.onclick = () => showView("chat");
      viewTermButton.onclick = () => showView("term");
      termListEl.onchange = () => {
        if (termListEl.value && termListEl.value !== termActiveId) {
          void openTerminal(termListEl.value).catch((error) => setTermStatus(error.message, true));
        }
      };
      document.getElementById("term-new").onclick = () => {
        void openTerminal(newTermId()).catch((error) => setTermStatus(error.message, true));
      };
      document.getElementById("term-kill").onclick = () => {
        if (termWs?.readyState === 1) {
          termWs.onclose = null;
          termWs.send(JSON.stringify({ op: "kill" }));
          termWs.close();
          termWs = null;
          setTermStatus("Terminal killed");
          void refreshTermList();
        }
      };
      window.addEventListener("resize", () => {
        if (!termView.hidden) termFit?.fit();
      });

      maybePair().then(() => {
        connect();
        // /terminal deep-links straight into the machine's shell, t3code-style.
        if (location.pathname === "/terminal") showView("term");
      });
    </script>
  </body>
</html>
