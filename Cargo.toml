# Code2 — a document-first coding-agent app.
# Cargo workspace. Members are added as each milestone lands:
#   crates/core          (M0/M1) — the shared brain: ACP client, sessions, skills, ...
#   crates/tui           (M3)    — ratatui frontend, links core
#   apps/desktop/src-tauri (M2)  — Tauri desktop bridge, links core
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tui",
    "crates/server",
    "crates/codetwo-protocol",
    "crates/codetwo-client",
    "crates/codetwo-daemon",
    "crates/codetwo-mcp-proxy",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = ""
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "3.0.1"

# Local crates
codetwo-core = { path = "crates/core" }
codetwo-protocol = { path = "crates/codetwo-protocol" }
codetwo-client = { path = "crates/codetwo-client" }
codetwo-daemon = { path = "crates/codetwo-daemon" }
