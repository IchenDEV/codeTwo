# C2 — a document-first coding-agent app.
# Cargo workspace:
#   crates/kernel        — reactive plugin runtime (cordis port)
#   crates/core          — shared product core: ACP, sessions, skills, providers, persistence
#   crates/plugins       — built-in adapters, CoreApp graph, extension bundles, plugin protocol
#   crates/server        — headless Axum server, WebSocket, remote/web UI
#   apps/desktop/src-host — Electrobun desktop sidecar, links CoreApp
[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/core",
    "crates/plugins",
    "crates/server",
    "apps/desktop/src-host",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/IchenDEV/codeTwo"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

# Local crates
codetwo-kernel = { path = "crates/kernel" }
codetwo-core = { path = "crates/core" }
codetwo-plugins = { path = "crates/plugins" }

[patch.crates-io]
# 0.2.1 links Ghostty's Windows static archive under the Unix library name. Keep the published
# source revision and normalize the Windows artifact name locally until the upstream fix ships.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

# Keep local builds useful for backtraces without retaining multi-gigabyte
# debug symbols and incremental state. The test profile inherits these values.
[profile.dev]
debug = "line-tables-only"
incremental = false
